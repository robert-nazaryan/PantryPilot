name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Verify (tests + typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x core-service/mvnw

      - name: Backend build + PMD + SpotBugs + tests
        working-directory: core-service
        run: ./mvnw --batch-mode --no-transfer-progress clean install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
