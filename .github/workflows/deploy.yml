name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x core-service/mvnw

      - name: core-service build + PMD + SpotBugs + tests
        working-directory: core-service
        run: ./mvnw --batch-mode --no-transfer-progress clean install

      - name: Ensure notification-service mvnw is executable
        run: chmod +x notification-service/mvnw

      - name: notification-service build + PMD + SpotBugs + tests
        working-directory: notification-service
        run: ./mvnw --batch-mode --no-transfer-progress clean install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

  build-and-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push core-service
        uses: docker/build-push-action@v6
        with:
          context: ./core-service
          file: ./core-service/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-core-service:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-core-service:latest
          cache-from: type=gha,scope=core-service
          cache-to: type=gha,scope=core-service,mode=max

      - name: Build & push notification-service
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          file: ./notification-service/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-notification-service:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,scope=notification-service,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/pantrypilot-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            Caddyfile
          sparse-checkout-cone-mode: false

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy directory
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'mkdir -p ~/pantrypilot'

      - name: Copy compose file & Caddyfile
        run: |
          scp docker-compose.prod.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/pantrypilot/docker-compose.prod.yml"
          scp Caddyfile \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/pantrypilot/Caddyfile"

      - name: Write production .env on the server
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_OWNER: ${{ env.IMAGE_NAMESPACE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > ~/pantrypilot/.env" <<EOF
          GHCR_OWNER=${GHCR_OWNER}
          IMAGE_TAG=${IMAGE_TAG}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          EOF
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'chmod 600 ~/pantrypilot/.env'

      - name: Log in to GHCR on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Pull images & restart stack
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            cd ~/pantrypilot &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans &&
            docker image prune -f
          '

      - name: Post-deploy health check
        run: |
          set -e
          echo "waiting up to 90s for services to become healthy..."
          for i in $(seq 1 30); do
            frontend_code=$(curl -sk -o /dev/null -w "%{http_code}" https://pantry-pilot.duckdns.org/ || echo "000")
            backend_code=$(curl -sk -o /dev/null -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" -d '{}' \
              https://pantry-pilot.duckdns.org/api/auth/login || echo "000")
            echo "  attempt $i: frontend=$frontend_code backend=$backend_code"
            if [ "$frontend_code" = "200" ] && [ "$backend_code" = "400" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          exit 1
