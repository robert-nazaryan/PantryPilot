spring:
  application:
    name: PantryPilot

  datasource:
    url: jdbc:postgresql://localhost:5432/pantrypilot
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

auth:
  refresh-cookie:
    secure: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
